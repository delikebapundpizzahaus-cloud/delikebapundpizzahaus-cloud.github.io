<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><script>window.DELI_API="https://script.google.com/macros/s/AKfycbw8h6RbL3cyvXoOIFztEQOfbBSB3BndKC71EQbp6shhCl18yr6h3wpDlS8mLthgotU/exec";</script><link rel="icon" type="image/png" sizes="32x32" href="/icons/telefon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/icons/telefon-192.png"><link rel="apple-touch-icon" href="/icons/telefon-apple-180.png"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-title" content="DELI Telefon"><meta name="theme-color" content="#1f5fd1">
<title>DELI Kebap · Online bestellen</title>
<style>
:root{--bg:#f3f1ee;--surface:#fff;--fg:#1d1a18;--muted:#6b635d;--line:#ddd7d1;--accent:#c4361c;--accent-fg:#fff;--accent-soft:#f8e2dc;
--ok:#2e6b3c;--ok-soft:#e1efe4;--warn:#9a5b00;--warn-soft:#f8ebd2;--late:#b3261e;--late-soft:#f9dedb;
--display:"Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);padding:0 0 110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding:12px 0}
.top img{height:54px;width:auto;display:block}
.top h1{font-size:26px;line-height:1.05}
.top h1 small{display:block;font:13px var(--body);color:var(--muted);letter-spacing:0}
.open{font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;margin:0 0 12px}
.open.yes{background:var(--ok-soft);color:var(--ok)}
.open.no{background:var(--late-soft);color:var(--late)}
.cats{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 16px;margin:0 -16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
@media (hover:hover) and (pointer:fine){.cats{flex-wrap:wrap;overflow-x:visible}}
.cats button{flex:0 0 auto;border:0;background:var(--surface);border-radius:10px;padding:6px 8px;display:grid;justify-items:center;gap:4px;min-width:78px;font-family:var(--display);font-size:16px;font-weight:700;box-shadow:0 1px 0 var(--line)}
.cats button img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.cats button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:6px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:76px}
.item.np{grid-template-columns:minmax(0,1fr) auto}
.item img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.item b{display:block;font-size:16px;line-height:1.2}
.item small{color:var(--muted);font-variant-numeric:tabular-nums}
.item.out{opacity:.5;cursor:not-allowed}
.item.out .plus{background:var(--muted)}
.vbtns button:disabled,.tile:disabled{opacity:.4;cursor:not-allowed}
.item .plus{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:24px;font-weight:700;line-height:1}
/* Auswahl-Fenster (unten) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh h2{font-size:24px}
.x{border:0;background:var(--bg);border-radius:50%;width:38px;height:38px;font-size:20px;flex:0 0 auto}
.vbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.vbtns button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 8px;font-weight:700;display:grid;gap:2px;justify-items:center}
.vbtns button small{font-weight:400;color:var(--muted)}
.vbtns img{width:64px;height:64px;object-fit:contain}
.bt{font-size:14px;font-weight:700}
.bt span{font-weight:400;color:var(--muted)}
/* Ender 08.11.: Soße kräftig rot, Mit allem kräftig grün */
.bt.sauce{font-family:var(--display);font-size:22px;color:#e00000}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{width:80px;min-height:84px;border:2px solid var(--line);background:var(--surface);border-radius:12px;display:grid;justify-items:center;align-content:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:700;position:relative}
.tile .em{font-size:30px;line-height:1.1}
.tile .ph{width:60px;height:60px;border-radius:8px;object-fit:cover;display:block}
.tile .pr{font-size:11px;font-weight:400;color:var(--muted)}
.tile.x{border-color:var(--late);background:var(--late-soft);color:var(--late)}
.tile.x .ph,.tile.x .em{opacity:.3;filter:grayscale(1)}
.tile.x::after{content:"✕";position:absolute;top:6px;left:0;right:0;text-align:center;font-size:40px;line-height:1;color:var(--late)}
.tile.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.tile.on[data-n="Ohne Soße"]{border-color:var(--late);background:var(--late-soft);color:var(--late)}
.tile.on::before{content:"✓";position:absolute;top:2px;right:6px;font-size:14px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-family:var(--display);font-size:20px;font-weight:700}
.mode button[data-mode="mit"]{color:#00a32e}
.mode button[data-mode="mit"][aria-pressed="true"]{border-color:#00a32e;background:var(--ok-soft);color:#00a32e}
.mode button[data-mode="nur"][aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.lbon{display:grid;gap:1px}
.bl{font-weight:800;font-size:14px}
.bl.all{color:#00a32e}.bl.no{color:#0047d4}.bl.sa{color:#e00000}.bl.ex{color:var(--fg)}
.bl.nur{background:var(--warn-soft);padding:2px 6px;border-radius:6px;justify-self:start}
.big{border:0;background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:16px;font-family:var(--display);font-size:22px;font-weight:700;width:100%}
.big:disabled{opacity:.45;cursor:not-allowed}
/* Warenkorb-Leiste */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.bar button{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar .cnt{background:var(--accent-fg);color:var(--accent);border-radius:999px;min-width:30px;padding:0 8px;font-size:18px}
.line{border-bottom:1px solid var(--line);padding:8px 0;display:grid;gap:4px}
.lh{display:flex;align-items:center;gap:8px}
.lname{flex:1;min-width:0;font-weight:700}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:18px}
.qty span{min-width:22px;text-align:center;font-weight:700}
.lprice{min-width:70px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ledit{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700}
label.f{display:block;font-size:14px;font-weight:700}
label.f input,label.f select{margin-top:4px}
label.f span{font-weight:400;color:var(--muted)}
input,select{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 140px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:700;text-align:center}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:26px;border-top:2px solid var(--fg);padding-top:8px}
.err{color:var(--late);font-weight:700}
.note{font-size:13px;color:var(--muted)}
.done{text-align:center;display:grid;gap:10px;justify-items:center;padding:20px 0}
.done .no{font-family:var(--display);font-size:64px;line-height:1;color:var(--accent)}
.done .st{font-size:18px;font-weight:700;padding:8px 16px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.done .st.fertig{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:30}
footer{margin-top:24px;font-size:13px;color:var(--muted)}
body.tel header{border-bottom:6px solid #1f5fd1}body.tel header h1{color:#1f5fd1}
[hidden]{display:none!important}
</style></head><body>

function cfgFor(c,n){
  if(["Kebap","Yufka","Lahmacun","Teller","Menü"].includes(c))return "full";
  if(c==="Schüler")return /Box/.test(n)?"sauce":"full";
  if(c==="Vegetarisch")return /box|teller/i.test(n)?"sauce":"full";
  if(["Kebapbox","Kinder","Nuggets"].includes(c))return "sauce";
  if(["Getränke","Extras"].includes(c))return null;
  return "s2";
}
function bonLines(l){
  const out=[];
  if(l.cfg){const s=l.sauces||[];if(s.includes("Ohne Soße"))out.push(["no","OHNE SOSSE"]);else out.push(["sa","SOSSE: "+(s.length?s.join(", ").toUpperCase():"KEINE")])}
  if(l.cfg==="full"){
    const ohne=l.ohne||[],have=ING.map(x=>x[0]).filter(x=>!ohne.includes(x));
    if(!ohne.length)out.push(["all","MIT ALLEM"]);
    else if(!have.length)out.push(["no","KEINE ZUTATEN"]);
    else if(ohne.length<=have.length){out.push(["all","MIT ALLEM"]);out.push(["no","OHNE "+ohne.join(", ").toUpperCase()])}
    else out.push(["nur","NUR "+have.join(", ").toUpperCase()]);
  }
  if(l.extras&&l.extras.length)out.push(["ex","EXTRA: "+l.extras.join(", ").toUpperCase()]);
  if(l.cups&&l.cups.length)out.push(["ex","SOSSE IM BECHER: "+l.cups.join(", ").toUpperCase()]);

}

function server(fn,...args){
  return new Promise((res,rej)=>{
    if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...args);return}
    if(window.DELI_API){fetch(window.DELI_API,{method:"POST",credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})})
      .then(r=>r.json()).then(d=>d&&d.ok?res(d.r):rej(new Error((d&&d.e)||"Fehler"))).catch(()=>rej(new Error("Keine Verbindung. Bitte nochmal tippen oder anrufen: 0711 44038178")));return}
    setTimeout(()=>{try{res(LOCAL[fn](...args))}catch(e){rej(e)}},300);
  });
}

const WD=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
function dayLabel(d){const t=new Date(),tm=new Date(t);tm.setDate(t.getDate()+1);
  return sameDay(d,t)?"heute":sameDay(d,tm)?"morgen":WD[d.getDay()]+" "+pad(d.getDate())+"."+pad(d.getMonth()+1)+".";}

// Abholtage wie bei SumUp: die nächsten 3 offenen Tage, jeweils nur Zeiten in den Öffnungszeiten
function slotDays(n=3,lead=20,from=0){
  const now=new Date(),days=[];
  for(let i=0;i<8&&days.length<n;i++){
    const day=new Date(now);day.setDate(now.getDate()+i);
    const h=hoursFor(day),mid=new Date(day);mid.setHours(0,0,0,0);
    const at=m=>new Date(mid.getTime()+m*60000);
    const earliest=i===0?Math.max(h[0],Math.ceil((now-mid)/60000)+lead,from):Math.max(h[0],from), last=h[1]-10;
    if(earliest>last)continue;
    const out=[at(earliest)];
    for(let m=Math.ceil((earliest+5)/15)*15;m<=last;m+=15)out.push(at(m));
    days.push(out);
  }
  return days;
}
function slots(){return slotDays(1)[0]||[]}
function renderOpen(){
  const now=new Date(),h=hoursFor(now),m=now.getHours()*60+now.getMinutes(),s=slots();
  const e=$("openState");
  if(CFG.paused&&!TEL){e.className="open no";e.textContent="Online-Bestellung gerade pausiert · Bitte anrufen: 0711 44038178";return false}
  if(m>=h[0]&&m<h[1]-10){e.className="open yes";e.textContent="Jetzt geöffnet · Abholung in ca. 20 Minuten · Open now";}
  else if(s.length&&sameDay(s[0],now)){e.className="open yes";e.textContent="Noch geschlossen · Vorbestellen ab "+hm(s[0])+" Uhr möglich · Pre-order";}
  else if(s.length){e.className="open yes";e.textContent="Jetzt geschlossen · Du kannst schon für "+dayLabel(s[0])+" ab "+hm(s[0])+" Uhr vorbestellen · Pre-order";}
  else{e.className="open no";e.textContent="Heute geschlossen · Online-Bestellung wieder ab morgen · Closed today";}
  return s.length>0;
}

  ${outs.length?`<p class="err">Gerade aus: ${outs.map(l=>esc(l.name)).join(", ")}. Bitte entfernen oder ändern.</p>`:""}
  ${err?`<p class="err">${esc(err)}</p>`:""}
  <button class="big" data-send ${!cart.length||!sl.length||sending||outs.length||low?"disabled":""}>${sending?"Wird gesendet …":(TEL?"📞 An Küche senden · ":"Jetzt bestellen · Order now · ")+eur(sum+fee)}</button>
  ${TEL?"":`<p class="note">${isL()?"Du bezahlst bei Lieferung an der Tür.":"Du bezahlst bei Abholung im Laden."} Fragen: 0711 44038178</p>`}`;
}
function onCart(e){
  let b;
  if(b=e.target.closest("[data-inc]")){cart[+b.dataset.inc].qty++;saveCart();keep();renderCart();return}
  if(b=e.target.closest("[data-dec]")){const i=+b.dataset.dec;cart[i].qty--;if(cart[i].qty<1)cart.splice(i,1);saveCart();keep();renderCart();return}
  if(b=e.target.closest("[data-edit]")){keep();editIdx=+b.dataset.edit;const l=cart[editIdx];builder={name:l.name,price:l.price,cfg:l.cfg,ohne:[...(l.ohne||[])],sauces:[...(l.sauces||[])],extras:[...(l.extras||[])],cups:[...(l.cups||[])]};sheetMode="pick";renderPick();$("sheet").scrollTop=0;return}
  if(b=e.target.closest("[data-pay]")){keep();pay=b.dataset.pay;renderCart();return}
  if(b=e.target.closest("[data-dm]")){keep();dmode=b.dataset.dm;pickupSel="";renderCart();return}
  if(e.target.closest("[data-send]"))send();
}
let noteDraft="";
function keep(){const g=id=>$(id)?$(id).value:null;if(g("nm")!==null)cust.name=g("nm");if(g("ph")!==null)cust.phone=g("ph");if(g("nt")!==null)noteDraft=g("nt");if(g("pk"))pickupSel=g("pk");if(g("ad")!==null)addr=g("ad")}
async function send(){
  keep();err="";
  if(cust.name.trim().length<2)err="Bitte deinen Namen eingeben.";
  else if((!TEL||isL())&&cust.phone.replace(/\D/g,"").length<6)err=isL()?"Für die Lieferung brauchen wir die Telefonnummer.":"Bitte deine Telefonnummer eingeben.";
  else if(isL()&&(addr.trim().length<5||!/\d/.test(addr)))err="Bitte Straße und Hausnummer eingeben.";
  if(err){renderCart();$("nt").value=noteDraft;return}
  if(!TEL){LS.set("deli_cust",cust);if(isL())LS.set("deli_addr",addr)}sending=true;renderCart();
  try{
    const r=await server("saveOrder",{name:cust.name,phone:cust.phone,note:noteDraft,pay,pickup:pickupSel,tel:TELK,mode:isL()?"liefer":"abhol",address:isL()?addr.trim():"",
      lines:cart.map(l=>({name:l.name,price:l.price,add:l.add||0,qty:l.qty,cfg:l.cfg||null,ohne:l.ohne||[],sauces:l.sauces||[],extras:l.extras||[],cups:l.cups||[]}))});
    const sub=cart.reduce((a,l)=>a+unit(l)*l.qty,0),fee=feeOf(sub),sum=typeof r.total==="number"?r.total:sub+fee;
    LS.set(P+"last",{id:r.id,no:r.no,pickup:r.pickup,sum,fee,pay,name:cust.name,mode:isL()?"liefer":"abhol",address:isL()?addr.trim():""});
    cart=[];saveCart();noteDraft="";sending=false;if(TEL){cust={name:"",phone:""};pay="bar";addr="";dmode="abhol"}showDone();
  }catch(e2){sending=false;err=(e2&&e2.message)||"Senden hat nicht geklappt. Bitte nochmal tippen oder anrufen: 0711 44038178";renderCart()}
}
// ---------- Bestätigung ----------
let statusTimer=null;
const ST={neu:"Bestellung ist angekommen · Received","in Arbeit":"Wird zubereitet · Preparing",fertig:"Fertig zum Abholen · Ready",abgeholt:"Abgeholt · Picked up",storniert:"Storniert · Bitte anrufen: 0711 44038178"};
function showDone(){openSheet("done")}
function renderDone(st,reason,removed,total){
  const o=LS.get(P+"last",null);if(!o){closeSheet();return}
  if(TEL){
    $("sheet").innerHTML=`<div class="done"><div>📞 An die Küche gesendet</div><div class="no">${o.no}</div>
    <div style="font-size:20px">${esc(o.name||"")} · ${o.mode==="liefer"?"🚗 Lieferung ca.":"Abholung"} <b>${when(new Date(o.pickup))} Uhr</b></div>${o.mode==="liefer"?`<div><b>${esc(o.address)}</b>, Echterdingen</div>`:""}
    <div>${eur(o.sum)} · ${o.pay==="karte"?"Karte":"Bar"}</div>
    <p class="note">Dem Anrufer sagen: Nummer ${o.no}, ${o.mode==="liefer"?"Lieferung ca. "+when(new Date(o.pickup))+" Uhr, "+eur(o.sum)+(o.fee?" inkl. "+eur(o.fee)+" Liefergebühr":""):"abholen um "+when(new Date(o.pickup))+" Uhr"}.</p>
    <button class="big" data-new>Nächste Telefon-Bestellung</button></div>`;
    return;
  }
  if(st==="storniert"){
    $("sheet").innerHTML=`<div class="done"><div>Bestellung Nr. ${o.no}</div><div class="st" style="background:var(--late-soft);color:var(--late)">Leider storniert · Cancelled</div>
    ${reason?`<div style="font-size:18px"><b>${esc(reason)}</b></div>`:""}
    <div>Entschuldige bitte! Du kannst gleich etwas anderes bestellen oder uns anrufen: 0711 44038178</div>
    <button class="big" data-new>Neu bestellen · New order</button></div>`;
    return;
  }
  $("sheet").innerHTML=`<div class="done"><div>Danke für deine Bestellung! · Thank you!</div><div>Deine Nummer · Your number</div><div class="no">${o.no}</div>
  <div style="font-size:20px">${o.mode==="liefer"?"🚗 Lieferung ca. · Delivery":"Abholung · Pick-up"} <b>${when(new Date(o.pickup))} Uhr</b></div>${o.mode==="liefer"?`<div><b>${esc(o.address)}</b>, Echterdingen</div>`:""}
  <div class="st ${st==="fertig"?"fertig":""}">${ST[st||"neu"]||ST.neu}</div>
  ${removed&&removed.length?`<div style="background:var(--late-soft);color:var(--late);border-radius:10px;padding:10px 12px;font-weight:700">Leider aus, gestrichen · Not available: ${esc(removed.join(", "))}</div>`:""}
  <div>${eur(typeof total==="number"&&removed&&removed.length?total:o.sum)} · ${o.pay==="karte"?"Karte":"Bar"} ${o.mode==="liefer"?"bei Lieferung":"bei Abholung"}${o.fee?" · inkl. "+eur(o.fee)+" Liefergebühr":""}</div>
  <p class="note">Tübinger Str. 8, Echterdingen · 0711 44038178</p>
  <button class="big" data-new>Neue Bestellung · New order</button></div>`;
  clearTimeout(statusTimer);
  if(st!=="abgeholt")statusTimer=setTimeout(pollStatus,15000);
}
async function pollStatus(){const o=LS.get(P+"last",null);if(TEL||!o||sheetMode!=="done")return;
  try{const s=await server("orderStatus",o.id);if(sheetMode==="done")renderDone(s&&s.status,s&&s.reason,s&&s.removed,s&&s.total)}catch(e){statusTimer=setTimeout(pollStatus,15000)}}
function render(){if(sheetMode==="pick")renderPick();else if(sheetMode==="cart")renderCart();else if(sheetMode==="done")renderDone();}

renderOpen();renderCats();renderBar();loadConfig();setInterval(loadConfig,60000);
const last=LS.get(P+"last",null);
if(!TEL&&last&&Date.now()-new Date(last.pickup).getTime()<3600000){showDone();pollStatus()}
</script>
</body></html>
