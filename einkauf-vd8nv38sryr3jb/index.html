.sup button{flex:0 0 auto;border:0;background:var(--surface);border-radius:10px;padding:10px 14px;font-family:var(--display);font-size:18px;font-weight:700;box-shadow:0 1px 0 var(--line);position:relative}
.sup button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;margin:4px 0 6px;font-size:16px}
.cat{font-size:20px;margin:18px 0 8px;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:8px}
.row.on{border-color:var(--ok);background:var(--ok-soft)}
.row b{display:block;font-size:17px;line-height:1.2}
.row small{color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:46px;height:46px;border-radius:50%;border:0;font-size:26px;font-weight:700;line-height:1;display:grid;place-items:center}
.qty .m{background:var(--bg)}
.qty .p{background:var(--accent);color:var(--accent-fg)}
.qty output{min-width:30px;text-align:center;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.add{width:100%;border:2px dashed var(--line);background:transparent;border-radius:12px;padding:14px;font-weight:700;color:var(--muted);margin-top:10px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;gap:10px;align-items:center;padding:0}
.bar .info{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.bar .info b{display:block;color:var(--fg);font-size:17px}
.big{border:0;border-radius:12px;padding:14px 20px;font:700 19px var(--display);background:var(--accent);color:var(--accent-fg)}
.big:disabled{opacity:.4;cursor:not-allowed}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh h2{font-size:24px}
.x{border:0;background:var(--bg);border-radius:50%;width:40px;height:40px;font-size:20px;flex:0 0 auto}
pre{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;margin:0;font:15px/1.45 var(--body)}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.btns .big{width:100%}
.wa{background:var(--wa)!important}
.sec{background:var(--bg)!important;color:var(--fg)!important;border:1px solid var(--line)!important}
.done{background:var(--ok)!important}
label{display:grid;gap:4px;font-size:14px;font-weight:700}
label input{border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:400;font-size:16px}
.hint{font-size:14px;color:var(--muted);margin:0}
.hist{border-top:1px solid var(--line);padding-top:8px}
.hist b{font-size:15px}
.hist div{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--fg);color:#fff;border-radius:10px;padding:10px 16px;z-index:30;font-weight:700}

const chosen = l => items(l).filter(a => qtyOf(l, a) > 0);
const kontakt = l => Object.assign({ tel: l.whatsapp || '', email: l.email || '', ruf: l.bestellhotline || l.tel || '' }, st.kontakt[l.id] || {});

function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1800) }

function renderSup(){
  $('sup').innerHTML = D.map(l => { const n = chosen(l).length;
    return '<button data-id="'+esc(l.id)+'" aria-pressed="'+(l.id===cur)+'">'+esc(l.name)+(n?'<span class="n">'+n+'</span>':'')+'</button>' }).join('');
}
function renderList(){
  const l = sup(cur); if (!l) { $('list').innerHTML = '<p class="empty">Keine Lieferanten</p>'; return }
  const q = $('q').value.trim().toLowerCase();
  const arr = items(l).filter(a => !q || a.name.toLowerCase().includes(q));
  if (!arr.length) { $('list').innerHTML = '<p class="empty">Nichts gefunden</p>'; return }
  const cats = []; const by = {};
  arr.forEach(a => { const c = a.kategorie || 'Sonstiges'; if (!by[c]) { by[c] = []; cats.push(c) } by[c].push(a) });
  $('list').innerHTML = cats.map(c => '<h3 class="cat">'+esc(c)+'</h3>' + by[c].map(a => {
    const k = key(l, a), n = qtyOf(l, a);
    const sub = [a.einheit, a.preis != null ? 'zuletzt ' + eur(a.preis) + (a.preisDatum ? ' (' + a.preisDatum + ')' : '') : ''].filter(Boolean).join(' · ');
    return '<div class="row'+(n?' on':'')+'"><div><b>'+esc(a.name)+'</b><small>'+esc(sub)+'</small></div>'+
      '<div class="qty"><button class="m" data-k="'+esc(k)+'" data-d="-1" aria-label="weniger">−</button><output>'+n+'</output><button class="p" data-k="'+esc(k)+'" data-d="1" aria-label="mehr">+</button></div></div>' }).join('')).join('');
}
function renderBar(){
  const l = sup(cur); const ch = l ? chosen(l) : [];
  const total = D.reduce((s, x) => s + chosen(x).length, 0);
  $('info').innerHTML = l ? '<b>'+esc(l.name)+': '+ch.length+' Artikel</b>'+(total>ch.length?'Alle Lieferanten: '+total:'') : '';
  $('orderBtn').disabled = !ch.length;
}
function render(){ renderSup(); renderList(); renderBar() }

$('sup').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cur = b.dataset.id; st.cur = cur; save(); $('q').value=''; render(); scrollTo(0,0) });
$('q').addEventListener('input', renderList);
$('list').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (!b) return;
  const k = b.dataset.k; const n = Math.max(0, (st.qty[k] || 0) + Number(b.dataset.d));
  if (n) st.qty[k] = n; else delete st.qty[k]; save();
  b.parentNode.querySelector('output').textContent = n; b.closest('.row').classList.toggle('on', n > 0); renderSup(); renderBar() });

function modal(html){ $('modal').innerHTML = '<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  const bg = $('modal').firstChild; bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('.x')) close() }) }
function close(){ $('modal').innerHTML = '' }

function orderText(l){
  const d = new Date(); const ds = d.toLocaleDateString('de-DE');
  const lines = chosen(l).map(a => '- ' + qtyOf(l, a) + ' x ' + a.name + (a.einheit ? ' (' + a.einheit + ')' : ''));
  return 'Hallo, hier ist Deli Kebap und Pizza Haus, Tübinger Str. 8, Leinfelden-Echterdingen' + (l.kundennr ? ' (Kunden-Nr. ' + l.kundennr + ')' : '') + '.\nBestellung vom ' + ds + ':\n\n' + lines.join('\n') + '\n\nVielen Dank!';
}
$('orderBtn').addEventListener('click', () => {
  const l = sup(cur); if (!l || !chosen(l).length) return;
  const k = kontakt(l); const txt = orderText(l);
  const tel = (k.tel || '').replace(/[^\d+]/g, '').replace(/^\+/, '').replace(/^00/, '').replace(/^0/, '49');
  modal('<div class="sh"><h2>Bestellung an '+esc(l.name)+'</h2><button class="x" aria-label="Schließen">✕</button></div>'+
    '<pre id="txt">'+esc(txt)+'</pre>'+
    '<div class="btns">'+
      (tel ? '<a class="big wa" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+tel+'?text='+encodeURIComponent(txt)+'">WhatsApp</a>' : '')+
      (k.email ? '<a class="big" style="text-align:center;text-decoration:none" href="mailto:'+esc(k.email)+'?subject='+encodeURIComponent('Bestellung Deli Kebap und Pizza Haus')+'&body='+encodeURIComponent(txt)+'">E-Mail</a>' : '')+
      (k.ruf ? '<a class="big sec" style="text-align:center;text-decoration:none" href="tel:'+esc(k.ruf.replace(/[^\d+]/g,''))+'">Anrufen</a>' : '')+
      '<button class="big sec" id="copy">Text kopieren</button>'+
    '</div>'+
    (!tel && !k.email ? '<p class="hint">Für WhatsApp oder E-Mail fehlt die Nummer bzw. Adresse. Unten eintragen.</p>' : '')+
    '<button class="big done" id="done">✓ Bestellt – Liste leeren</button>'+
    '<details><summary class="hint">Telefon / E-Mail von '+esc(l.name)+' ändern</summary><div style="display:grid;gap:8px;margin-top:8px">'+
      '<label>WhatsApp-Nummer<input id="kt" inputmode="tel" value="'+esc(k.tel)+'"></label>'+
      '<label>E-Mail<input id="ke" type="email" value="'+esc(k.email)+'"></label>'+
      '<button class="big sec" id="ks">Speichern</button></div></details>');
  $('copy').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Kopiert'), () => toast('Bitte Text markieren und kopieren')) };
  $('ks').onclick = () => { st.kontakt[l.id] = { tel: $('kt').value.trim(), email: $('ke').value.trim() }; save(); close(); $('orderBtn').click() };
  $('done').onclick = () => {
    st.hist.unshift({ l: l.name, d: new Date().toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }), a: chosen(l).map(a => qtyOf(l, a) + ' x ' + a.name) });
    st.hist = st.hist.slice(0, 60);
    chosen(l).forEach(a => delete st.qty[key(l, a)]); save(); close(); render(); toast('Gespeichert');
  };
});
$('histBtn').addEventListener('click', () => {
  modal('<div class="sh"><h2>Zuletzt bestellt</h2><button class="x" aria-label="Schließen">✕</button></div>'+
    (st.hist.length ? st.hist.map(h => '<div class="hist"><b>'+esc(h.l)+' · '+esc(h.d)+'</b><div>'+h.a.map(esc).join('<br>')+'</div></div>').join('') : '<p class="empty">Noch nichts bestellt</p>'));
});
$('addBtn').addEventListener('click', () => {
  const l = sup(cur); if (!l) return;
  modal('<div class="sh"><h2>Neuer Artikel bei '+esc(l.name)+'</h2><button class="x" aria-label="Schließen">✕</button></div>'+
    '<label>Name<input id="an" placeholder="z. B. Mozzarella 2,5 kg"></label><label>Einheit<input id="ae" placeholder="z. B. Karton"></label>'+
    '<button class="big" id="as">Hinzufügen</button>');
  $('an').focus();
  $('as').onclick = () => { const n = $('an').value.trim(); if (!n) return;
    (st.eigene[l.id] = st.eigene[l.id] || []).push({ name: n, einheit: $('ae').value.trim(), kategorie: 'Eigene Artikel' }); save(); close(); render() };
});
render();
})();
</script>
</body></html>
